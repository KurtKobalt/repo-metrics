name: Manual Repo Metrics (GitHub Pages)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dashboard
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Clone OneVisa repositories
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          METRICS_REPOS_ROOT: ${{ runner.temp }}/onevisa-repositories
        run: |
          mkdir -p "$METRICS_REPOS_ROOT"
          while IFS='|' read -r repository directory; do
            if ! gh repo clone "onevisa-ai/$repository" "$METRICS_REPOS_ROOT/$directory" -- --quiet --single-branch; then
              echo "::warning::Could not clone onevisa-ai/$repository"
            fi
          done <<'REPOSITORIES'
          ov-capture-frontend|ov-capture-frontend
          ov-capture-backend|ov-capture-backend
          ov-admin|ov-admin
          ov-superadmin|ov-superadmin
          ov-cms|ov-cms
          ov-translator|ov-translator
          ov-submitter|ov-submitter
          ov-website|ov-website2
          ov-control-center|ov-control-center
          ov-qa|ov-qa
          ov-pulse|ov-pulse
          claude-plugins|claude-plugins
          REPOSITORIES

      - name: Verify and generate metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          METRICS_REPOS_ROOT: ${{ runner.temp }}/onevisa-repositories
        run: |
          python3 -m unittest discover -s tests
          python3 scripts/metrics.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Build dashboard
        working-directory: dashboard
        run: |
          npm ci
          npm run build

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
